spring.application.name=Project-Portal
server.port=${PORT:8080}
server.tomcat.max-swallow-size=-1

spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require&currentSchema=public
spring.datasource.username=postgres.atigmiqhlwgepndlgsfn
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000

# Additional Hikari settings for stability
spring.datasource.hikari.pool-name=ProjectPortalPool
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.data-source-properties.stringtype=unspecified

#File Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
file.upload.directory=${UPLOAD_DIR:/tmp/uploads/projects/}
file.storage.type=local


# Email Configuration
spring.mail.username=${SPRING_MAIL_USERNAME}
brevo.api.key=${BREVO_API_KEY}
brevo.api.url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}


# CORS Configuration
cors.allowed.origins=${FRONTEND_URL}

# Logging Configuration
logging.level.root=INFO
logging.level.projectPortal.com=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.zaxxer.hikari=DEBUG


# Security Header
server.error.include-message=never
server.error.include-stacktrace=never


# Admin Configuration
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}

# JWT Configuration
jwt.secret=${JWT_SECRET:ProjectPortalSecretKeyGenerateByAdminAndYou123456789012345678901234567890}


# Health Check Endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true


# Production Profile

spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}


# Transaction Management

spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# SSL/TLS Settings for Database

spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require
